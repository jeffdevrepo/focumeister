<form #timesheet="ngForm" (ngSubmit)="addNewTask(timesheet)">
    <div class="flex items-center gap-3 mb-6">
        <button [routerLink]="['/']" class="border border-gray-200 p-3 size-[42.5px] cursor-pointer">
            <svg lucideArrowLeft size="16" class="stroke-gray-950 mx-auto"></svg>
        </button>
        <div class="flex gap-3 min-w-[200px]">
            <app-select-dropdown
                name="project"
                [options]="projects()"
                valueKey="id"
                labelKey="name"
                [ngModel]="selectedProject()"
                (ngModelChange)="selectedProject.set($event); getTasks($event)"
                class="w-full"
            />
        </div>
    </div>
    <div class="flex items-stretch gap-2">
        <input type="text" 
            name="taskDescription" 
            [(ngModel)]="newTaskDescription" 
            placeholder="What is your current task?" 
            class="w-full px-4 py-2 h-[42px] border border-gray-200 outline-0 focus:ring-2"
        />
        <button class="bg-gray-950 px-4 flex items-center justify-center cursor-pointer w-[111px] shrink-0" type="submit">
            @if(taskAddLoading()) {
                <span class="me-2 text-white">Starting</span>
                <svg lucideLoaderCircle size="16" class="stroke-white animate-spin"></svg>
            } @else {
                <span class="me-2 text-white">Start</span>
                <svg lucidePlay size="16" class="stroke-white"></svg>
            }
        </button>
    </div>
</form>

<div class="mt-12">
    @if(!taskLoading()) {
        @for(task of tasks(); track task.id) {
            <app-task-list 
                [data]="task"
                [startImmediately]="autoStartTaskId() === task.id"
                (onUpdate)="updateTask($event)"
                (onDelete)="deleteTask($event)"
                (onTimerStarted)="clearAutoStartTask(task.id)"
            ></app-task-list>
        } @empty {
            <p class="text-gray-500 text-center">No tasks available.</p>
        }
    } @else {
        @for(item of [1, 2, 3]; track $index) {
            <div class="animate-pulse flex space-x-3 items-center py-1 px-2">
                <div class="bg-gray-200 rounded-full size-[35.5px]"></div>
                <div class="bg-gray-200 h-[14px] rounded-sm w-[350px]"></div>
                <div class="bg-gray-200 h-[14px] rounded-sm w-[100px] ms-auto"></div>
                <div class="bg-gray-200 rounded-full size-[35.5px]"></div>
            </div>
        }
    }
</div>
