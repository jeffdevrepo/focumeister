@if(dialog.request(); as request) {
    <div
        class="fixed inset-0 z-50 flex items-center justify-center bg-gray-900/45 p-6"
        role="presentation"
        (click)="cancelOnBackdrop($event)"
    >
        <section
            class="w-full max-w-md border border-gray-200 bg-white p-6 shadow-2xl"
            role="alertdialog"
            aria-modal="true"
            aria-labelledby="confirmation-dialog-title"
            aria-describedby="confirmation-dialog-message"
        >
            <h2 id="confirmation-dialog-title" class="text-lg font-semibold">{{ request.title }}</h2>
            <p id="confirmation-dialog-message" class="mt-3 text-sm text-gray-600">{{ request.message }}</p>

            <div class="mt-6 flex justify-end gap-2">
                <button
                    type="button"
                    class="min-h-10 border border-gray-200 px-4 py-2 font-medium transition hover:bg-gray-50"
                    (click)="dialog.cancelCurrent()"
                >
                    {{ request.cancelLabel ?? 'Cancel' }}
                </button>
                <button
                    type="button"
                    class="min-h-10 bg-red-500 px-4 py-2 font-medium text-white transition hover:bg-gray-800"
                    (click)="dialog.confirmCurrent()"
                >
                    {{ request.confirmLabel ?? 'Confirm' }}
                </button>
            </div>
        </section>
    </div>
}
